name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux (Ruby ${{ matrix.ruby-version }})
    # A suite that stalls should be a red check rather than an afternoon:
    # this is the only thing that stops a hung example, because a job that
    # never finishes has no log to read.
    timeout-minutes: 15
    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
        json-parser: ['JSON', 'Oj', 'Yajl']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Install libcurl (libcurl4-openssl-dev) and PostgreSQL headers
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libpq-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Verify pg loads
      run: bundle exec ruby -e 'require "pg"'
    - name: Verify libcurl loads
      run: bundle exec ruby -e 'require "curb"'
    - name: Run tests (ubuntu)
      env:
        DASHSCOPE_API_HOST: token-plan.ap-southeast-1.maas.aliyuncs.com
        JSON_PARSER: ${{ matrix.json-parser }}
        LLMRB_POSTGRESQL_URL: postgres://postgres:postgres@localhost:5432/postgres
      run: bundle exec rake spec

