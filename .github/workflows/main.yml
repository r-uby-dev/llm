name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux (Ruby ${{ matrix.ruby-version }})
    timeout-minutes: 15
    strategy:
      matrix:
        ruby-version: ['4.0', '4.1.0-preview1']
        json-parser: ['JSON']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Install PostgreSQL headers
      run: sudo apt-get update && sudo apt-get install -y libpq-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Verify pg loads
      run: bundle exec ruby -e 'require "pg"'
    - name: Run tests (ubuntu)
      env:
        DASHSCOPE_API_HOST: token-plan.ap-southeast-1.maas.aliyuncs.com
        JSON_PARSER: ${{ matrix.json-parser }}
        LLMRB_POSTGRESQL_URL: postgres://postgres:postgres@localhost:5432/postgres
      run: bundle exec rake spec

  macos:
    runs-on: macos-latest
    name: macOS (Ruby ${{ matrix.ruby-version }})
    timeout-minutes: 30
    strategy:
      matrix:
        ruby-version: ['4.0']
        json-parser: ['JSON']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Verify pg loads
      run: bundle exec ruby -e 'require "pg"'
    - name: Verify curses loads
      run: bundle exec ruby -e 'require "curses"'
    - name: Run tests (macos)
      env:
        DASHSCOPE_API_HOST: token-plan.ap-southeast-1.maas.aliyuncs.com
        JSON_PARSER: ${{ matrix.json-parser }}
      run: bundle exec rake spec

  windows:
    runs-on: windows-latest
    name: Windows (Ruby ${{ matrix.ruby-version }})
    timeout-minutes: 30
    strategy:
      matrix:
        ruby-version: ['head']
        json-parser: ['JSON']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests (windows)
      env:
        LLMRB_DEBUG_MODE: "1"
        DASHSCOPE_API_HOST: token-plan.ap-southeast-1.maas.aliyuncs.com
        JSON_PARSER: ${{ matrix.json-parser }}
      run: bundle exec rake spec
